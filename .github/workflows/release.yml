name: Create and publish release

on:
  push:
    tags:
    - '*'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required by Create release step
      id-token: write       # required to mint OIDC token for Sigstore signing
      attestations: write   # required to write attestation to the repo
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ci

      - name: Attest build artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release
        # https://github.com/ncipollo/release-action
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifactErrorsFailBuild: true
          draft: true
          artifacts: "dist/main.js,dist/manifest.json,dist/styles.css"
